  <style>
    .euclid-graphic {
      --geom-fg: #1c1917;
      --geom-bg: #faf8f5;
      --geom-muted: #78716c;
      --geom-accent: #b45309;
      --geom-assert: #15803d;
      --geom-grid: #d6d3d1;
      font-family: "Gentium Plus", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    }
    @media (prefers-color-scheme: dark) {
      .euclid-graphic {
        --geom-fg: #e8e2d5;
        --geom-bg: #1c1c21;
        --geom-muted: #a8a195;
        --geom-accent: #e2b553;
        --geom-assert: #78c491;
        --geom-grid: #44403c;
      }
    }
    .euclid-graphic .geom-stroke { stroke: var(--geom-fg); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .euclid-graphic .geom-grid { stroke: var(--geom-grid); stroke-width: 1.0; fill: none; }
    .euclid-graphic .geom-dash { stroke: var(--geom-muted); stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .euclid-graphic .geom-arc { stroke: var(--geom-accent); stroke-width: 1.6; fill: none; }
    .euclid-graphic .geom-overlay { stroke: var(--geom-assert); stroke-width: 2.2; fill: none; opacity: 0; }
    .euclid-graphic .geom-pt { fill: var(--geom-accent); stroke: var(--geom-fg); stroke-width: 0.9; }
    .euclid-graphic .geom-lbl { fill: var(--geom-fg); font-size: 13px; text-anchor: middle; dominant-baseline: central; }
    .euclid-graphic .geom-lbl-sm { fill: var(--geom-muted); font-size: 11px; text-anchor: middle; dominant-baseline: central; }
    .euclid-graphic .geom-lbl-b { fill: var(--geom-fg); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .euclid-graphic .geom-alpha { fill: var(--geom-accent); font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  </style>
