    <line x1="320.0" y1="392.0" x2="320.0" y2="72.0" class="grid-line"/>
    <line x1="64.0" y1="136.0" x2="384.0" y2="136.0" class="grid-line"/>
    <line x1="352.0" y1="392.0" x2="352.0" y2="72.0" class="grid-line"/>
