  </style>
  <g id="highlights"/>
  <text x="430" y="28" text-anchor="middle" class="title">Nicomachus II.20 — Sum of Consecutive Cubes Equals the Squared Triangle</text>
  <text x="430" y="48" text-anchor="middle" class="subtitle">1³ + 2³ + 3³ + 4³ = (1 + 2 + 3 + 4)² = 10² = 100 · Odd-block sums &amp; L-gnomon square dissection</text>
  <g data-ref="TRISQ">
    <g data-ref="CUBE1">
      <polygon points="64.0,392.0 96.0,392.0 96.0,360.0 64.0,360.0" fill="#e2b553" fill-opacity="0.30" stroke="#e2b553" stroke-width="2.0"/>
    </g>
    <g data-ref="CUBE2">
      <polygon points="96.0,392.0 160.0,392.0 160.0,296.0 64.0,296.0 64.0,360.0 96.0,360.0" fill="#6ba9d8" fill-opacity="0.30" stroke="#6ba9d8" stroke-width="2.0"/>
      <text x="144.0" y="346.0" class="mono">2³ = 8</text>
    </g>
    <g data-ref="CUBE3">
      <polygon points="160.0,392.0 256.0,392.0 256.0,200.0 64.0,200.0 64.0,296.0 160.0,296.0" fill="#78c491" fill-opacity="0.30" stroke="#78c491" stroke-width="2.0"/>
      <text x="224.0" y="266.0" class="mono">3³ = 27</text>
    </g>
    <g data-ref="CUBE4">
      <polygon points="256.0,392.0 384.0,392.0 384.0,72.0 64.0,72.0 64.0,200.0 256.0,200.0" fill="#b48ee0" fill-opacity="0.30" stroke="#b48ee0" stroke-width="2.0"/>
      <text x="336.0" y="154.0" class="mono">4³ = 64</text>
    </g>
