    <text x="430" y="382" text-anchor="middle" class="lbl-b">Book II.12 Universal Triangular Decomposition: P(s, n) = P(s − 1, n) + Tₙ₋₁ = Tₙ + (s − 3)·Tₙ₋₁</text>
