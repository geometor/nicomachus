  <g data-ref="WEAVE">
    <rect x="25" y="330" width="790" height="118" rx="8" class="card"/>
    <text x="420" y="354" text-anchor="middle" class="lbl-b">Book II.19 Alternating Weave: Every Heteromecic Hₙ = n(n+1) is the Geometric Mean of Sₙ = n² and Sₙ₊₁ = (n+1)²</text>
    <rect x="34.0" y="368" width="68" height="32" rx="6" class="card-accent"/>
    <text x="68.0" y="389" text-anchor="middle" class="mono">S₁=1</text>
    <rect x="122.0" y="368" width="68" height="32" rx="6" class="card-blue"/>
    <text x="156.0" y="389" text-anchor="middle" class="mono">H₁=2</text>
    <rect x="210.0" y="368" width="68" height="32" rx="6" class="card-accent"/>
    <text x="244.0" y="389" text-anchor="middle" class="mono">S₂=4</text>
    <rect x="298.0" y="368" width="68" height="32" rx="6" class="card-blue"/>
    <text x="332.0" y="389" text-anchor="middle" class="mono">H₂=6</text>
    <rect x="386.0" y="368" width="68" height="32" rx="6" class="card-accent"/>
    <text x="420.0" y="389" text-anchor="middle" class="mono">S₃=9</text>
    <rect x="474.0" y="368" width="68" height="32" rx="6" class="card-blue"/>
    <text x="508.0" y="389" text-anchor="middle" class="mono">H₃=12</text>
    <rect x="562.0" y="368" width="68" height="32" rx="6" class="card-accent"/>
    <text x="596.0" y="389" text-anchor="middle" class="mono">S₄=16</text>
    <rect x="650.0" y="368" width="68" height="32" rx="6" class="card-blue"/>
    <text x="684.0" y="389" text-anchor="middle" class="mono">H₄=20</text>
    <rect x="738.0" y="368" width="68" height="32" rx="6" class="card-accent"/>
    <text x="772.0" y="389" text-anchor="middle" class="mono">S₅=25</text>
    <text x="420" y="430" text-anchor="middle" class="mono">Sₙ · Sₙ₊₁ = Hₙ²   (e.g. 4 × 9 = 6²,  9 × 16 = 12²,  16 × 25 = 20²)   &amp;   Hₙ = 2 · Tₙ</text>
